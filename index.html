<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Universo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, serif;
      color: white;
      background:
        radial-gradient(circle at 50% 30%, #29345f 0%, #11152f 45%, #050714 100%);
    }

    .estrellas {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, white 1px, transparent 1px);
      background-size: 90px 90px, 140px 140px;
      background-position: 10px 20px, 50px 70px;
      opacity: 0.7;
    }

    .luna {
      position: absolute;
      top: 12%;
      right: 12%;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fff8dc;
      box-shadow: 0 0 35px rgba(255, 248, 220, 0.7);
    }

    .contenido {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 650px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 25px;
      background: rgba(10, 12, 35, 0.55);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 21px;
      line-height: 1.7;
    }

    .boton {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      border-radius: 30px;
      background: #ffffff;
      color: #171a3a;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.3s;
    }

    .boton:hover {
      transform: scale(1.08);
    }
  </style>
</head>

<body>

  <div class="estrellas"></div>
  <div class="luna"></div>

  <div class="contenido">
    <h1>✨ Nuestro Universo ✨</h1>

    <p>
      Feliz cumpleaños. 💕
      <br><br>
      Quería darte algo especial y único,
      porque eres muy importante para mí.
    </p>

    <a href="#" class="boton">Entrar ❤️</a>
  </div> href="carta.html">Entrar❤️</a>.
