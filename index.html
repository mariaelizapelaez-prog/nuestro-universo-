<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro pequeño universo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #35145c 0%, #160c2b 35%, #07040f 75%);
}

/* ESTRELLAS */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, #b99cff 1px, transparent 1px);
    background-size: 70px 70px, 110px 110px;
    background-position: 10px 20px, 40px 60px;
    opacity: .35;
    animation: stars 12s linear infinite;
}

@keyframes stars {
    from { transform: translateY(0); }
    to { transform: translateY(70px); }
}

/* PANTALLA */

.screen {
    width: 100%;
    min-height: 100vh;
    padding: 35px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    text-align: center;
    max-width: 700px;
    margin-bottom: 25px;
}

.small-title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #a994ff;
    margin-bottom: 12px;
}

h1 {
    font-size: clamp(28px, 7vw, 52px);
    text-shadow:
        0 0 10px #9d68ff,
        0 0 25px #673ab7;
}

.subtitle {
    margin-top: 12px;
    color: #cfc4e8;
    font-size: 15px;
    line-height: 1.6;
}

/* MAPA */

.game-area {
    position: relative;
    width: min(900px, 96vw);
    height: 620px;
    margin-top: 10px;
    border: 2px solid rgba(177, 123, 255, .45);
    border-radius: 25px;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        rgba(5,3,15,.65);
    background-size: 35px 35px;
    box-shadow:
        0 0 40px rgba(117, 61, 220, .25),
        inset 0 0 50px rgba(0,0,0,.6);
    overflow: hidden;
}

/* CAMINO */

.path {
    position: absolute;
    left: 12%;
    top: 50%;
    width: 76%;
    height: 8px;
    background: #7650b7;
    box-shadow: 0 0 15px #8f5cff;
    transform: translateY(-50%);
    border-radius: 20px;
}

.path::before,
.path::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 190px;
    background: #7650b7;
    box-shadow: 0 0 15px #8f5cff;
    border-radius: 20px;
}

.path::before {
    left: 20%;
    top: -95px;
}

.path::after {
    right: 20%;
    top: -95px;
}

/* PAREDES DEL LABERINTO */

.wall {
    position: absolute;
    background: linear-gradient(90deg, #211235, #47246c, #211235);
    border: 1px solid #71449c;
    box-shadow: 0 0 10px rgba(142, 76, 210, .5);
    border-radius: 5px;
}

.wall.one {
    width: 150px;
    height: 18px;
    left: 5%;
    top: 20%;
}

.wall.two {
    width: 18px;
    height: 120px;
    left: 30%;
    top: 8%;
}

.wall.three {
    width: 150px;
    height: 18px;
    right: 5%;
    top: 22%;
}

.wall.four {
    width: 18px;
    height: 120px;
    right: 30%;
    bottom: 8%;
}

.wall.five {
    width: 140px;
    height: 18px;
    left: 10%;
    bottom: 17%;
}

.wall.six {
    width: 140px;
    height: 18px;
    right: 10%;
    bottom: 17%;
}

/* PUNTOS */

.point {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid #d6bcff;
    background: radial-gradient(circle, #a765ff, #4b1f76);
    box-shadow:
        0 0 10px #a765ff,
        0 0 25px rgba(167,101,255,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    cursor: pointer;
    transition: .3s;
    z-index: 5;
}

.point:hover {
    transform: scale(1.18);
    box-shadow:
        0 0 15px white,
        0 0 35px #b06cff;
}

.point span {
    position: absolute;
    top: 72px;
    white-space: nowrap;
    font-size: 11px;
    color: #d9cced;
    letter-spacing: 1px;
}

.start {
    left: 6%;
    top: 45%;
}

.memory1 {
    left: 25%;
    top: 18%;
}

.memory2 {
    left: 43%;
    top: 45%;
}

.memory3 {
    right: 25%;
    top: 18%;
}

.memory4 {
    right: 6%;
    top: 45%;
}

/* REGALO FINAL */

.gift {
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    width: 90px;
    height: 80px;
    cursor: pointer;
    z-index: 6;
}

.gift-box {
    position: absolute;
    bottom: 0;
    width: 90px;
    height: 60px;
    background: linear-gradient(135deg, #5b267e, #9c4dcc);
    border: 2px solid #d9a8ff;
    box-shadow: 0 0 25px #9b4ddd;
    border-radius: 5px;
}

.gift-box::before {
    content: "";
    position: absolute;
    left: 39px;
    width: 12px;
    height: 60px;
    background: #e6c5ff;
}

.gift-lid {
    position: absolute;
    top: 5px;
    left: -5px;
    width: 100px;
    height: 18px;
    background: #b75ee5;
    border: 2px solid #e3b8ff;
    border-radius: 4px;
}

.gift:hover {
    animation: giftShake .5s infinite;
}

@keyframes giftShake {
    0%,100% { transform: translateX(-50%) rotate(0); }
    25% { transform: translateX(-50%) rotate(-3deg); }
    75% { transform: translateX(-50%) rotate(3deg); }
}

.gift-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11px;
    color: #e5d5ff;
}

/* VENTANA */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(3,1,10,.82);
    backdrop-filter: blur(7px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
}

.modal.active {
    display: flex;
}

.card {
    width: min(520px, 94vw);
    padding: 35px 25px;
    text-align: center;
    border-radius: 22px;
    border: 1px solid #9d69d8;
    background: linear-gradient(145deg, #160d25, #291344);
    box-shadow: 0 0 45px rgba(151, 79, 225, .5);
    animation: appear .4s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.card h2 {
    color: #e4c8ff;
    margin-bottom: 18px;
}

.card p {
    color: #d4c9df;
    line-height: 1.7;
}

.close {
    margin-top: 25px;
    padding: 11px 25px;
    border: none;
    border-radius: 30px;
    background: #8c4bd1;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.close:hover {
    background: #aa65ed;
}

/* MOVIL */

@media (max-width: 600px) {
    .game-area {
        height: 570px;
    }

    .point {
        width: 54px;
        height: 54px;
        font-size: 20px;
    }

    .wall.one,
    .wall.three,
    .wall.five,
    .wall.six {
        width: 90px;
    }

    .path {
        width: 80%;
    }

    .point span {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="screen">

    <div class="header">
        <div class="small-title">PLAYER 01 • BIRTHDAY QUEST</div>

        <h1>Nuestro pequeño universo 🌙</h1>

        <p class="subtitle">
            Hay algo especial esperándote al final...
            pero primero tendrás que encontrar el camino. ✨
        </p>
    </div>

    <div class="game-area">

        <div class="path"></div>

        <div class="wall one"></div>
        <div class="wall two"></div>
        <div class="wall three"></div>
        <div class="wall four"></div>
        <div class="wall five"></div>
        <div class="wall six"></div>

        <!-- INICIO -->

        <div class="point start" onclick="openMemory('Comienza aquí ✨', 'Tu aventura empieza justo aquí. No tengas prisa... quiero que descubras cada pequeño secreto.')">
            ▶
            <span>COMENZAR</span>
        </div>

        <!-- RECUERDO 1 -->

        <div class="point memory1" onclick="openMemory('Nivel 01 ❤️', 'Aquí aparecerá uno de nuestros primeros recuerdos. Podemos poner una foto, una fecha o una pequeña historia de nosotros.')">
            ❤️
            <span>RECUERDO</span>
        </div>

        <!-- RECUERDO 2 -->

        <div class="point memory2" onclick="openMemory('Nivel 02 🎮', 'Aquí podemos poner otro recuerdo especial. Incluso podemos hacer que tengas que descubrir una pequeña pista para continuar.')">
            🎮
            <span>NIVEL 02</span>
        </div>

        <!-- RECUERDO 3 -->

        <div class="point memory3" onclick="openMemory('Nivel 03 💌', 'Un pequeño mensaje solo para ti. Esta parte la personalizaremos con algo que solamente nosotros entendamos.')">
            💌
            <span>CARTA</span>
        </div>

        <!-- FINAL -->

        <div class="point memory4" onclick="openMemory('Ya casi... 👀', 'Has llegado muy lejos. Pero todavía queda una última sorpresa escondida en el mapa.')">
            ⭐
            <span>CASI AL FINAL</span>
        </div>

        <!-- REGALO -->

        <div class="gift" onclick="openMemory('🎁 EL REGALO', 'Aquí estará la gran recompensa. Más adelante vamos a colocar aquí la carta de Yu-Gi-Oh! ❤️')">
            <div class="gift-label">RECOMPENSA FINAL</div>
            <div class="gift-lid"></div>
            <div class="gift-box"></div>
        </div>

    </div>

</div>

<!-- VENTANA -->

<div class="modal" id="modal">
    <div class="card">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <button class="close" onclick="closeMemory()">CONTINUAR ❤️</button>
    </div>
</div>

<script>

function openMemory(title, text) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalText").textContent = text;
    document.getElementById("modal").classList.add("active");
}

function closeMemory() {
    document.getElementById("modal").classList.remove("active");
}

</script>

</body>
</html>
